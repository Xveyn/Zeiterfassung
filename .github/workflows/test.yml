name: Tests

on: [push, pull_request]

# Vorgabe für ALLE Jobs unten. Ohne diesen Block erben sie die
# Repo-Einstellung, und die steht hier auf `write` — jeder Test-, Lint- und
# Typecheck-Lauf hätte damit einen GITHUB_TOKEN, der nach master pushen
# könnte. Gebraucht wird das von keinem Job dieser Datei: sie klonen,
# installieren `requirements-test.txt` und führen Tests aus. Wer hier je einen
# Job ergänzt, der mehr braucht (etwa einen Kommentar an einen PR), gibt ihm
# einen eigenen Block auf Job-Ebene, statt diese Vorgabe aufzuweichen.
permissions:
  contents: read

jobs:
  changes:
    # Ermittelt, ob dieser Lauf überhaupt Code betrifft. Ein PR, der nur
    # Dokumentation anfasst, soll die Test-Matrix nicht durchlaufen müssen.
    #
    # WICHTIG — warum KEIN `paths-ignore` am Trigger: ein Workflow, der wegen
    # Path-Filtern gar nicht erst startet, meldet seine Check-Contexts NIE.
    # Stehen sie als Required Checks in der Branch Protection, wartet GitHub
    # ewig darauf und der PR bleibt dauerhaft „blocked" — dieselbe Falle wie
    # beim `test`-Sammel-Gate unten, nur aus der anderen Richtung. Ein per
    # `if:` ÜBERSPRUNGENER Job meldet dagegen das Ergebnis „skipped", und das
    # gilt der Branch Protection als erfüllt. Deshalb läuft der Workflow
    # immer, und die Jobs schalten sich selbst ab.
    #
    # Dieser Job gehört deshalb SELBST in die Required Checks: fällt er aus,
    # werden alle abhängigen Jobs übersprungen — und „übersprungen" gilt als
    # erfüllt. Ohne ihn als Gate wäre ein PR dann grün, ohne dass je ein Test
    # gelaufen ist.
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Für den Diff gegen den Base-Branch. Das Repo ist klein, die
          # vollständige Historie kostet hier nichts.
          fetch-depth: 0
      - id: detect
        name: Betrifft die Änderung Code?
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # Fail-safe by construction: `true` ist die Vorgabe, `false` wird
          # NUR gesetzt, wenn das Diff sauber ermittelt wurde UND
          # ausschließlich Doku-Pfade enthält. Jeder Sonderfall (Push statt
          # PR, fehlender Base-Ref, git-Problem, leeres Diff) endet damit im
          # vollen Testlauf, nie im stillen Überspringen.
          code=true
          range=
          ZERO=0000000000000000000000000000000000000000
          if [ "$EVENT" = "pull_request" ] && [ -n "$BASE_REF" ]; then
            # Netto-Aenderung des PR gegenueber dem Base-Branch.
            range="origin/$BASE_REF...HEAD"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "$ZERO" ]; then
            # Neuer Branch (BEFORE = lauter Nullen) und force-push, dessen
            # Vorgaenger-Objekt nicht mehr existiert, fallen hier heraus bzw.
            # scheitern unten am git-Aufruf -- beides endet in code=true.
            range="$BEFORE..HEAD"
          fi
          if [ -n "$range" ]; then
            if files=$(git diff --name-only "$range") && [ -n "$files" ]; then
              echo "Geänderte Dateien:"
              echo "$files" | sed 's/^/  /'
              # Alles, was NICHT auf ein Doku-Muster passt, ist Code.
              # `.github/` ist bewusst Code: eine Workflow-Änderung muss sich
              # selbst testen.
              if ! echo "$files" | grep -qvE '(^|/)[^/]+\.md$|^docs/|^\.superpowers/|^LICENSE$'; then
                code=false
              fi
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "true" ]; then
            echo "→ Code betroffen: Tests laufen."
          else
            echo "→ Nur Dokumentation: Test-Jobs werden übersprungen."
          fi

  test-matrix:
    # Audit N25: über alle unterstützten Python-Versionen testen (README: 3.10+),
    # nicht nur 3.10. fail-fast=false, damit ein Ausreißer die anderen nicht
    # abbricht. macOS/Windows verifizieren die Plattform (unten, je 3.10) —
    # hier geht es um die Sprachversion.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      # Das Linux-SNI-Tray wird gegen einen ECHTEN dbus-daemon geprüft
      # (tests/test_tray_linux_dbus.py) — die einzige Ebene, auf der sich die
      # D-Bus-Signaturen überhaupt prüfen lassen (#42). Fehlt das Binary,
      # skippen diese Tests STILL und der Build bliebe grün, obwohl das
      # gesamte Wire-Level-Netz weg ist. Deshalb hier laut scheitern, statt
      # sich stillschweigend auf das Runner-Image zu verlassen.
      - name: dbus-daemon vorhanden (sonst skippen die SNI-Wire-Tests still)
        run: dbus-daemon --version
      - run: pytest tests/

  test:
    # Sammel-Gate für die Branch Protection. Ein Matrix-Job meldet seine
    # Check-Contexts NUR mit Suffix (`test-matrix (3.10)`, `test-matrix (3.11)`, …) — ein
    # Context, der schlicht `test` heißt, entsteht dabei nie. Steht `test` als
    # Required Check in der Branch Protection, wartet GitHub ewig darauf und
    # der PR bleibt trotz grüner Matrix auf "blocked" hängen. Dieser Job
    # meldet den Namen `test` unabhängig von der Matrix-Form weiter: künftige
    # Änderungen an Achsen oder Python-Versionen ändern den Required-Check-
    # Namen damit nicht mehr.
    #
    # `always()` ist Pflicht — ohne das würde der Job bei roter Matrix
    # übersprungen statt zu scheitern, und ein übersprungener Required Check
    # gilt GitHub als erfüllt. Deshalb wird `result` explizit geprüft, statt
    # sich auf das implizite needs-Verhalten zu verlassen.
    #
    # Der Zusatz `needs.changes.outputs.code == 'true'` ist die EINZIGE
    # Ausnahme davon: bei einem Doku-only-PR soll dieser Job bewusst
    # übersprungen werden und damit als erfüllt gelten. Fällt der
    # `changes`-Job aus, ist der Output leer, die Bedingung also falsch und
    # der Job wird ebenfalls übersprungen — genau deshalb steht `changes`
    # selbst mit in den Required Checks.
    needs: [changes, test-matrix]
    if: always() && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Matrix-Ergebnis prüfen
        run: |
          echo "test-matrix: ${{ needs.test-matrix.result }}"
          [ "${{ needs.test-matrix.result }}" = "success" ]

  coverage:
    # Coverage-Report (Audit N24) — reines Reporting, KEIN fail_under-Gate
    # (Config in pyproject.toml, [tool.coverage]). Ein Lauf auf ubuntu/3.10
    # reicht; die Zahlen sind plattformunabhängig.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt pytest-cov==7.1.0
      - run: pytest --cov=src --cov-report=term-missing tests/

  test-macos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt pyobjc-framework-Cocoa==12.2.1
      - run: pytest tests/

  test-windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: pytest tests/

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install ruff==0.15.10
      - run: ruff check .

  typecheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-test.txt
      # Gleiche Minimal-Deps wie der test-matrix-Job (aus requirements-test.txt), damit
      # unsere eigenen Typen (google-*, holidays, pytest) auflösen. Die
      # plattform-optionalen Lazy-Imports (xhtml2pdf/Pillow/pystray/pyobjc) sind
      # an der Import-Zeile per `# pyright: ignore[reportMissingImports]`
      # entschärft — kein requirements.txt nötig (pycairo/pyobjc wären hier
      # ohnehin nicht baubar). pyright pinnen: neuere Versionen ziehen strengere
      # Checks nach.
      - run: pip install -r requirements-test.txt pyright==1.1.411
      - run: pyright
