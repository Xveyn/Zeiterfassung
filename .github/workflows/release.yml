name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Pre-Release bauen (plattformübergreifender Test-Build, kein echtes Release)"
        type: boolean
        default: false

# Vorgabe für alle Jobs, die keinen eigenen Block haben — das sind die drei
# build-Jobs, die nur klonen, bauen und ein Artefakt hochladen. `pre-check`
# und `publish` setzen eigene `permissions:` und überschreiben diese Vorgabe
# damit; `publish` behält insbesondere sein `contents: write` für Tag-Push
# und Release-Anlage.
permissions:
  contents: read

jobs:
  pre-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.gate.outputs.should_release }}
      is_prerelease: ${{ steps.gate.outputs.is_prerelease }}
      tag: ${{ steps.tag.outputs.tag }}
      title: ${{ steps.tag.outputs.title }}
      notes_start: ${{ steps.tag.outputs.notes_start }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      # Push-Events tragen keine PR-Labels. Das release:*-Gate wird daher über
      # den zum Merge-Commit gehörenden PR per API geprüft. Manuelle Läufe
      # (workflow_dispatch) sind ein bewusster Auslöser und umgehen das Gate.
      - name: Decide whether to release
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manueller Lauf → Release (prerelease=${{ inputs.prerelease }})."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.prerelease }}" = "true" ]; then
              echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          # Push-Events sind nie Pre-Release; Gate über das release:*-Label des PR.
          labels=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[].labels[].name' 2>/dev/null || true)
          echo "Labels des zugehörigen PR: ${labels:-<keine>}"
          if echo "$labels" | grep -qE '^release:(major|minor|patch)$'; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "Kein release:*-Label → übersprungen."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read version
        id: version
        if: steps.gate.outputs.should_release == 'true'
        shell: bash
        run: |
          VERSION=$(python -c "from src.version import VERSION; print(VERSION)")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing v${VERSION}"

      - name: Compute tag, title and notes-start
        id: tag
        if: steps.gate.outputs.should_release == 'true'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git fetch --tags
          if [ "${{ steps.gate.outputs.is_prerelease }}" = "true" ]; then
            # Reihenfolge-Invariante (s. CLAUDE.md, Abschnitt Pre-Releases): ein
            # Pre-Release trägt die Version des ZULETZT veröffentlichten Releases
            # und enthält den Stand danach. Die App ordnet deshalb
            # vX.Y.Z < vX.Y.Z-pre.N (version.parse_release_id). Entstünde ein
            # Pre-Release VOR seinem echten Release (erst version.py bumpen, dann
            # Pre bauen), böte die App Opt-in-Nutzern nach dessen Veröffentlichung
            # dauerhaft den älteren Pre als Update an — ohne Selbstheilung.
            # Darum hier hart abbrechen statt die Regel nur zu dokumentieren.
            if ! git rev-parse "v${VERSION}" >/dev/null 2>&1; then
              echo "::error::Tag v${VERSION} existiert noch nicht — ein Pre-Release wird immer NACH dem gleichnamigen echten Release gebaut (s. CLAUDE.md, Abschnitt Pre-Releases). Entweder src/version.py auf die zuletzt veröffentlichte Version zurücksetzen oder zuerst v${VERSION} releasen."
              exit 1
            fi
            # Fortlaufende Nummer je Zielversion: höchstes vorhandenes
            # v<VERSION>-pre.N + 1 (Start bei 1). Kein Existenz-Abbruch — der
            # Pre-Release-Tag darf mehrfach je Version entstehen.
            max=0
            for t in $(git tag -l "v${VERSION}-pre.*"); do
              n="${t##*.}"
              if echo "$n" | grep -qE '^[0-9]+$' && [ "$n" -gt "$max" ]; then
                max="$n"
              fi
            done
            N=$((max + 1))
            TAG="v${VERSION}-pre.${N}"
            TITLE="Zeiterfassung v${VERSION} - Pre-Release ${N}"
          else
            # Echtes Release: Tag darf noch nicht existieren (erzwingt Version-Bump).
            TAG="v${VERSION}"
            TITLE="Zeiterfassung v${VERSION}"
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "::error::Tag ${TAG} already exists. Bump src/version.py vor dem Merge."
              exit 1
            fi
          fi
          # Release-Notes ab dem letzten ECHTEN Release (ohne -pre-Suffix): so
          # bleiben Voll-Release-Notes vollständig (unbeeinflusst von zwischen-
          # zeitlichen Pre-Releases) und Pre-Release-Notes kumulativ = alle PRs
          # seit dem letzten Release. Leer beim allerersten Release → gh nutzt
          # dann seine Auto-Erkennung.
          NOTES_START=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "notes_start=${NOTES_START}" >> "$GITHUB_OUTPUT"
          echo "→ tag=${TAG} title='${TITLE}' notes_start='${NOTES_START:-<auto>}'"

  build-windows:
    needs: pre-check
    if: needs.pre-check.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt pip-licenses==5.5.5
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress
      - name: Build
        env:
          ZEIT_RELEASE: "1"
          ZEIT_PRERELEASE: ${{ needs.pre-check.outputs.is_prerelease == 'true' && '1' || '' }}
          ZEIT_RELEASE_TAG: ${{ needs.pre-check.outputs.tag }}
        run: python scripts/build.py
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/Zeiterfassung_Setup.exe
          # build.py überspringt den Pack-Schritt mit einer Warnung, wenn das
          # Pack-Tool fehlt (gewollt für Local-Dev) — im Release-Build wäre das
          # ein stummer Totalausfall: leeres Artefakt, grüner Job, Fehler erst
          # im publish beim sha256sum, ohne Hinweis auf die Plattform.
          if-no-files-found: error

  build-macos-arm:
    needs: pre-check
    if: needs.pre-check.outputs.should_release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt pip-licenses==5.5.5
      - name: Install create-dmg
        run: brew install create-dmg
      - name: Build
        env:
          ZEIT_RELEASE: "1"
          ZEIT_PRERELEASE: ${{ needs.pre-check.outputs.is_prerelease == 'true' && '1' || '' }}
          ZEIT_RELEASE_TAG: ${{ needs.pre-check.outputs.tag }}
        run: python scripts/build.py
      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm
          path: dist/Zeiterfassung-*-arm64.dmg
          if-no-files-found: error

  build-linux:
    needs: pre-check
    if: needs.pre-check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libcairo2-dev pkg-config
      - name: Install appimagetool
        run: |
          curl -L -o appimagetool "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/
      - name: Install Python dependencies
        run: pip install -r requirements.txt pip-licenses==5.5.5
      - name: Build
        env:
          ZEIT_RELEASE: "1"
          ZEIT_PRERELEASE: ${{ needs.pre-check.outputs.is_prerelease == 'true' && '1' || '' }}
          ZEIT_RELEASE_TAG: ${{ needs.pre-check.outputs.tag }}
        run: python scripts/build.py
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/Zeiterfassung-*-x86_64.AppImage
          if-no-files-found: error

  publish:
    needs: [pre-check, build-windows, build-macos-arm, build-linux]
    if: needs.pre-check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List downloaded artefacts
        run: ls -la dist/

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          VERSION="${{ needs.pre-check.outputs.version }}"
          # Prüfsummen mit reinen Dateinamen (ohne dist/-Pfad), damit der Nutzer
          # nach dem Download `sha256sum -c SHA256SUMS` im Ordner laufen lassen
          # kann. Explizite Namen statt Glob — sonst hasht SHA256SUMS sich selbst.
          cd dist
          sha256sum \
            Zeiterfassung_Setup.exe \
            "Zeiterfassung-${VERSION}-arm64.dmg" \
            "Zeiterfassung-${VERSION}-x86_64.AppImage" \
            > SHA256SUMS
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS

      - name: Tag and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.pre-check.outputs.version }}"
          TAG="${{ needs.pre-check.outputs.tag }}"
          TITLE="${{ needs.pre-check.outputs.title }}"
          NOTES_START="${{ needs.pre-check.outputs.notes_start }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          # Artefaktnamen tragen die reine VERSION (build.py benennt sie unabhängig
          # vom Pre-Release-Status) — der Tag/Titel kennzeichnet die Vorabversion.
          args=(
            "$TAG"
            dist/Zeiterfassung_Setup.exe
            "dist/Zeiterfassung-${VERSION}-arm64.dmg"
            "dist/Zeiterfassung-${VERSION}-x86_64.AppImage"
            dist/SHA256SUMS
            --title "$TITLE"
            --generate-notes
          )
          if [ -n "$NOTES_START" ]; then
            args+=(--notes-start-tag "$NOTES_START")
          fi
          if [ "${{ needs.pre-check.outputs.is_prerelease }}" = "true" ]; then
            args+=(--prerelease)
          fi
          # Rollback: der Tag ist zu diesem Zeitpunkt schon gepusht. Scheitert
          # `gh release create` (Netz, Rate-Limit), bliebe ein Tag ohne Release
          # zurück — und der Pre-Check des nächsten Laufs bricht dann an
          # "Tag already exists" ab, der Tag müsste von Hand gelöscht werden
          # (CLAUDE.md, "Recovery bei teilweise fehlgeschlagenem Release").
          # Erst ein eventuell halb angelegtes Release entfernen, dann den Tag:
          # andersherum bliebe ein Release ohne Tag stehen. Beide Aufräum-
          # schritte dürfen selbst scheitern, ohne die Fehlerursache zu
          # verdecken — deshalb `|| true` und ein explizites exit 1.
          if ! gh release create "${args[@]}"; then
            echo "::error::gh release create fehlgeschlagen — rolle Tag $TAG zurück"
            gh release delete "$TAG" --yes || true
            git push origin ":refs/tags/$TAG" || true
            exit 1
          fi

  # Raeumt README-Marker weg, die inzwischen KEEP_RELEASES echte Releases alt
  # sind (scripts/resolve_readme_version.py --prune). Laeuft NACH dem Release,
  # weil sich der Kreis der reifen Marker ausschliesslich durch ein Release
  # aendert — ein Cron liefe die meiste Zeit umsonst.
  #
  # Nur bei echten Releases: ein Pre-Release traegt die Version des
  # VORANGEGANGENEN Releases (s. CLAUDE.md, "Pre-Releases"), das Alter der
  # Marker aendert sich dadurch nicht.
  #
  # Der Job pusht einen BRANCH und oeffnet einen PR — bewusst kein Push nach
  # master. Das Ruleset "Protect master" greift nur auf ~DEFAULT_BRANCH, ein
  # Feature-Branch ist also frei; und die Regel "Der Workflow pusht nichts nach
  # master" bleibt unangetastet. Dass ein Mensch die Prosa-Aenderung vor dem
  # Merge sieht, ist Absicht: entfernt wird Text aus der Startseite.
  readme-marker-cleanup:
    needs: [pre-check, publish]
    if: >-
      needs.pre-check.outputs.should_release == 'true' &&
      needs.pre-check.outputs.is_prerelease != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # Branch pushen (nicht master)
      pull-requests: write   # PR oeffnen
    steps:
      - uses: actions/checkout@v7
        with:
          # --prune liest die Release-Tags ueber `git tag -l`; ohne die
          # vollstaendige Historie waere die Tag-Liste leer und nie ein
          # Marker reif — der Job liefe still ins Leere.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Alte Marker entfernen
        id: prune
        shell: bash
        run: |
          python scripts/resolve_readme_version.py --prune
          if git diff --quiet -- README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: PR oeffnen
        if: steps.prune.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.pre-check.outputs.version }}
        shell: bash
        run: |
          BRANCH="chore/readme-marker-cleanup-v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add README.md
          git commit -m "docs(readme): ueberholte Versionsmarker nach v${VERSION} entfernen"
          git push origin "$BRANCH"
          gh pr create --base master --head "$BRANCH" \
            --title "docs(readme): ueberholte Versionsmarker entfernen (nach v${VERSION})" \
            --body "Automatisch nach dem Release von v${VERSION} erzeugt.

          Entfernt wurden Marker \`*(ab X.Y.Z)*\`, deren Version inzwischen
          mindestens \`KEEP_RELEASES\` echte Releases zurueckliegt — siehe
          \`scripts/resolve_readme_version.py\` und CLAUDE.md, Abschnitt
          \"README-Zeilen fuer Unveroeffentlichtes markieren\".

          Rein kosmetisch: der Marker hat seinen Zweck erfuellt, sobald das
          Feature ein paar Releases lang ausgeliefert ist. Kein \`release:*\`-Label
          setzen." \
            --label documentation
