name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  pre-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.gate.outputs.should_release }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      # Push-Events tragen keine PR-Labels. Das release:*-Gate wird daher über
      # den zum Merge-Commit gehörenden PR per API geprüft. Manuelle Läufe
      # (workflow_dispatch) sind ein bewusster Auslöser und umgehen das Gate.
      - name: Decide whether to release
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manueller Lauf → Release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          labels=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[].labels[].name' 2>/dev/null || true)
          echo "Labels des zugehörigen PR: ${labels:-<keine>}"
          if echo "$labels" | grep -qE '^release:(major|minor|patch)$'; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Kein release:*-Label → übersprungen."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read version
        id: version
        if: steps.gate.outputs.should_release == 'true'
        shell: bash
        run: |
          VERSION=$(python -c "from src.version import VERSION; print(VERSION)")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing v${VERSION}"

      - name: Fail if tag already exists
        if: steps.gate.outputs.should_release == 'true'
        shell: bash
        run: |
          git fetch --tags
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ steps.version.outputs.version }} already exists. Bump src/version.py vor dem Merge."
            exit 1
          fi

  build-windows:
    needs: pre-check
    if: needs.pre-check.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller pip-licenses
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress
      - name: Build
        run: python build.py
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/Zeiterfassung_Setup.exe

  build-macos-arm:
    needs: pre-check
    if: needs.pre-check.outputs.should_release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller pip-licenses
      - name: Install create-dmg
        run: brew install create-dmg
      - name: Build
        run: python build.py
      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm
          path: dist/Zeiterfassung-*-arm64.dmg

  build-linux:
    needs: pre-check
    if: needs.pre-check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libcairo2-dev pkg-config
      - name: Install appimagetool
        run: |
          curl -L -o appimagetool "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/
      - name: Install Python dependencies
        run: pip install -r requirements.txt pyinstaller pip-licenses
      - name: Build
        run: python build.py
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/Zeiterfassung-*-x86_64.AppImage

  publish:
    needs: [pre-check, build-windows, build-macos-arm, build-linux]
    if: needs.pre-check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List downloaded artefacts
        run: ls -la dist/

      - name: Tag and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.pre-check.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" \
            dist/Zeiterfassung_Setup.exe \
            dist/Zeiterfassung-${VERSION}-arm64.dmg \
            dist/Zeiterfassung-${VERSION}-x86_64.AppImage \
            --title "Zeiterfassung v${VERSION}" \
            --generate-notes
