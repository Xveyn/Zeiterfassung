name: PWA-Version

# Haelt Release-PRs an, solange `pwa/package.json` nicht gegenueber dem letzten
# Release-Tag gebumpt ist (s. CLAUDE.md, „Release-Prozess", Schritt 1). Die
# Build-Kennung der Handy-PWA ist `P-N/X.Y.Z (sha)`; ein Release setzt N auf 0
# zurueck, also bekommt P bei jedem Release einen Bump — auch ohne PWA-Aenderung.
#
# Eigene Datei und kein Required Check aus denselben Gruenden wie
# `readme-version.yml` (Kurzform-Trigger in test.yml deckt `labeled` nicht ab;
# auf PRs ohne Release-Label meldet der Job seinen Context gar nicht).
# Kein `setup-python`: reine stdlib, `python3` der Runner genuegt (so macht es
# auch der publish-Job in release.yml) — und die Zahl der setup-python-Aufrufe
# steht in CLAUDE.md als geprueftes Datum.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  pwa-version:
    # Label-Namen exakt wie das Gate in release.yml (`^release:(major|minor|patch)$`).
    if: >-
      contains(github.event.pull_request.labels.*.name, 'release:major') ||
      contains(github.event.pull_request.labels.*.name, 'release:minor') ||
      contains(github.event.pull_request.labels.*.name, 'release:patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # das Skript liest die Release-Tags und pwa/package.json am letzten Tag
          fetch-tags: true
      - run: python3 scripts/pwa_stamp.py --check
