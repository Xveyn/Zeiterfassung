name: PWA veröffentlichen

# Veröffentlicht den Ordner pwa/ (die Handy-PWA) nach GitHub Pages unter
# https://xveyn.github.io/Zeiterfassung/. Braucht eine Repo-Einstellung, die nicht im Code
# steht: Settings → Pages → Source: „GitHub Actions“ (Issue #266). Ohne sie scheitert
# deploy-pages. Der Workflow pusht NICHTS nach master.

on:
  push:
    branches: [master]
    paths:
      - 'pwa/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ein Deploy nach dem anderen; ein laufender wird nicht abgebrochen (halb veröffentlicht
# wäre schlimmer als verzögert).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # ganze Historie + Tags: scripts/pwa_stamp.py zählt Commits seit dem letzten Release
          fetch-tags: true
      - name: Laufzeitdateien zusammenstellen und Build-Kennung einsetzen
        run: |
          set -euo pipefail
          mkdir _site
          # Nur, was die App zur Laufzeit braucht: kein test/, kein package.json.
          rsync -a --exclude 'test/' --exclude 'package.json' --exclude 'memory-adapter.js' --exclude 'node_modules/' pwa/ _site/
          # Build-Kennung „N/X.Y.Z (sha)“ einsetzen (Platzhalter __BUILD__ in sw-core.js und
          # Manifest); jeder Deploy bekommt damit einen eigenen Cache.
          python3 scripts/pwa_stamp.py _site
          if grep -rq "__BUILD__" _site; then echo "Platzhalter nicht ersetzt" >&2; exit 1; fi
          ls -R _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
