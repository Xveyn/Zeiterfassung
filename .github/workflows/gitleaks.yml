name: Gitleaks

# Sucht in Push und PR samt ganzer Historie nach eingecheckten Secrets
# (s. CLAUDE.md, „Tests / CI").
#
# WARUM EINE EIGENE DATEI statt eines Jobs in test.yml: dort überspringt der
# Torwächter `changes` reine Doku-PRs. Ein Secret in einer Markdown-Datei ist
# genauso eines, der Scan darf also nie wegfallen.
#
# WARUM DAS BINARY statt gitleaks/gitleaks-action: die Action verlangt für
# Repos in Organisationen eine Lizenz. Das Release-Binary ist frei, und der Pin
# samt SHA256-Prüfung entspricht der Supply-Chain-Linie des Repos (kein `latest`).
#
# Required Check im Ruleset „Protect master“ (das Ruleset liegt außerhalb des
# Repos; die Liste steht in CLAUDE.md, „Branch Protection“).

# `edited`: ein nachträglich geänderter PR-Text wird ebenfalls geprüft (s. letzter Schritt).
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # SHA256 von gitleaks_<Version>_linux_x64.tar.gz aus der checksums.txt des Releases.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      # Ganze Historie: ein Secret, das später wieder gelöscht wurde, steht
      # weiter im Verlauf und ist trotzdem kompromittiert.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks installieren
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
      # --redact: Fundstellen erscheinen im öffentlichen Log nie im Klartext.
      - name: Historie scannen
        run: ./gitleaks git --redact --no-banner --verbose
      # Links auf eine Claude-Code-Session (Regel `claude-session-link` in .gitleaks.toml) gehören
      # auch nicht in Commit-Nachrichten und PR-Texte; die sieht `gitleaks git` nicht. Geprüft
      # werden nur die neuen Commits des PRs bzw. Pushes: ältere Nachrichten auf master tragen
      # solche Links aus der Zeit vor der Regel. Die Texte kommen über env herein, nie per
      # Interpolation ins Skript.
      - name: Commit-Nachrichten und PR-Text prüfen
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$AFTER"
          else
            # Neuer Branch oder Force-Push: der Vorgänger ist unbekannt, die übrigen Commits prüft der PR.
            range="$AFTER^!"
          fi
          { git log --format=%B "$range"; printf '%s\n%s\n' "${PR_TITLE:-}" "${PR_BODY:-}"; } \
            | ./gitleaks stdin -c .gitleaks.toml --enable-rule claude-session-link --redact --no-banner --verbose
