name: Build

# Manueller Test-Build eines beliebigen Branches OHNE Release (kein Tag, kein
# Upload zu GitHub-Releases, kein Auto-Update-Effekt). Baut wie `build.py` die
# reine App (PyInstaller-Ausgabe) und lädt sie als Workflow-Artefakt hoch.
# Optional (`installer`-Häkchen) zusätzlich das Windows-Setup — für Änderungen
# an `installer.iss`, die sich sonst nirgends prüfen lassen: lokal fehlt Inno
# in der Regel, und ein Release nur zum Testen des Uninstallers wäre grob
# unverhältnismäßig. Zweck: einen Branch in CI-identischer Umgebung
# (Python 3.10 + gepinnte requirements.txt) bauen, ohne eine lokale venv zu
# pflegen, die zur CI divergieren kann. Der Installer/Pack-Schritt (Inno Setup /
# create-dmg / appimagetool) entfällt bewusst — `build.py` überspringt ihn
# automatisch, wenn das jeweilige Pack-Tool fehlt, und lässt die reine
# PyInstaller-Ausgabe stehen.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/Tag/SHA zum Bauen (leer = Branch, aus dem der Lauf startet)"
        type: string
        required: false
        default: ""
      windows:
        description: "Windows bauen (.exe)"
        type: boolean
        default: true
      macos:
        description: "macOS bauen (.app)"
        type: boolean
        default: false
      linux:
        description: "Linux bauen (Binary)"
        type: boolean
        default: false
      installer:
        description: "Windows: zusätzlich das Setup.exe bauen (braucht Inno Setup)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-windows:
    if: ${{ inputs.windows }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt pip-licenses==5.5.5
      # Ohne Inno Setup überspringt build.py den Installer-Schritt und lässt den
      # reinen dist/Zeiterfassung/-Ordner (onedir: Exe + _internal\, seit #118)
      # stehen. Ist es installiert, erzeugt derselbe Aufruf zusätzlich das
      # Setup.exe — build.py findet den Compiler über PATH bzw. die
      # Standardpfade (scripts/build.py::_find_inno_compiler), und Chocolatey
      # legt ihn nach %ProgramFiles(x86)%\Inno Setup 6 ab.
      - name: Install Inno Setup
        if: ${{ inputs.installer }}
        run: choco install innosetup -y --no-progress
      - name: Build (PyInstaller${{ inputs.installer && ' + Installer' || ', ohne Installer' }})
        run: python scripts/build.py
      - name: dist auflisten
        shell: bash
        run: ls -la dist/ dist/Zeiterfassung/
      # onedir-Ordner als Ganzes hochladen — upload-artifact zippt ihn. Unter
      # Windows gibt es keine Symlinks/Exec-Bits zu bewahren (anders als bei den
      # macOS-/Linux-Jobs), daher kein tar nötig; der Nutzer bekommt ein
      # browsebares Zip mit Zeiterfassung.exe + _internal\.
      - uses: actions/upload-artifact@v7
        with:
          name: zeiterfassung-windows-app
          path: dist/Zeiterfassung/
          if-no-files-found: error
          retention-days: 14
      # Eigenes Artefakt statt eines zweiten Pfads im obigen Upload: so bleibt
      # die App auch dann herunterladbar, wenn der Installer-Schritt scheitert.
      # `if-no-files-found: error` ist hier Absicht — wurde das Häkchen gesetzt
      # und fehlt die Datei trotzdem, hat build.py den Pack-Schritt still
      # übersprungen; das soll auffallen und nicht als grüner Lauf durchgehen.
      - uses: actions/upload-artifact@v7
        if: ${{ inputs.installer }}
        with:
          name: zeiterfassung-windows-setup
          path: dist/Zeiterfassung_Setup.exe
          if-no-files-found: error
          retention-days: 14

  build-macos:
    if: ${{ inputs.macos }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt pip-licenses==5.5.5
      # Kein create-dmg installiert → build.py überspringt den DMG-Schritt und
      # lässt das reine dist/Zeiterfassung.app (onedir-Bundle) stehen.
      - name: Build (PyInstaller, ohne DMG)
        run: python scripts/build.py
      - name: dist auflisten
        run: ls -la dist/
      # Das .app-Bundle enthält Symlinks und Exec-Bits — ein nackter
      # upload-artifact-Zip würde beides zerstören. tar bewahrt sie.
      - name: App-Bundle packen (tar, bewahrt Symlinks/Exec-Bits)
        run: tar -czf dist/Zeiterfassung-macos-app.tar.gz -C dist Zeiterfassung.app
      - uses: actions/upload-artifact@v7
        with:
          name: zeiterfassung-macos-app
          path: dist/Zeiterfassung-macos-app.tar.gz
          if-no-files-found: error
          retention-days: 14

  build-linux:
    if: ${{ inputs.linux }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      # libcairo2-dev + pkg-config: pycairo (transitiv über xhtml2pdf) braucht die
      # Cairo-Header beim pip-Build (sonst bricht die Installation). libfuse2 und
      # appimagetool entfallen bewusst — kein AppImage-Pack.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config
      - name: Install Python dependencies
        run: pip install -r requirements.txt pip-licenses==5.5.5
      # Kein appimagetool installiert → build.py überspringt den AppImage-Schritt
      # und lässt das reine dist/Zeiterfassung (onefile-Binary) stehen.
      - name: Build (PyInstaller, ohne AppImage)
        run: python scripts/build.py
      - name: dist auflisten
        run: ls -la dist/
      # Exec-Bit bewahren (upload-artifact-Zip würde es verlieren).
      - name: Binary packen (tar, bewahrt Exec-Bit)
        run: tar -czf dist/Zeiterfassung-linux.tar.gz -C dist Zeiterfassung
      - uses: actions/upload-artifact@v7
        with:
          name: zeiterfassung-linux-bin
          path: dist/Zeiterfassung-linux.tar.gz
          if-no-files-found: error
          retention-days: 14
