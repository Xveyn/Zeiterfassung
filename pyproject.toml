[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Kuratierter Default: pyflakes (F, echte Bugs wie unused/undefined) plus die
# semantisch relevanten pycodestyle-Gruppen E4/E7/E9. Bewusst OHNE Whitespace-/
# Zeilenlängen-Regeln (E1/E2/E3/E501) — das ist Formatter-Sache, kein Gate.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Test-Dateien gruppieren Imports bewusst vor den zugehörigen Test-Blöcken
# (Lesbarkeit nach Feature) statt alle am Dateikopf — kein Top-of-File-Zwang.
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Coverage-Reporting (Audit N24). Aktiv nur, wenn explizit mit `--cov`
# aufgerufen (der coverage-CI-Job bzw. lokal `pytest --cov=src`); ein normaler
# `pytest`-Lauf bleibt unverändert schnell.
[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
# BEWUSST kein fail_under-Gate: Coverage ist hier Reporting, kein harter
# CI-Blocker. Die UI/Tk-Schicht ist absichtlich nur über extrahierte
# Pure-Functions getestet (vgl. Audit M16) — ein Schwellwert-Gate färbte den
# Build sonst dauerhaft rot. Der Report zeigt Lücken, erzwingt sie aber nicht.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.pyright]
# Wird sowohl von der Pyright-CLI als auch von Pylance (VS Code) gelesen —
# eine einzige Quelle. Bewusst KEINE separate pyrightconfig.json, die wuerde
# diesen Block ueberstimmen.
typeCheckingMode = "basic"       # gleicht dem Pylance-Default an
pythonVersion = "3.10"
include = ["src", "tests"]
# Repo-Root in den Import-Suchpfad: sonst findet pyright das `src`-Paket aus
# den Test-Dateien (`from src.foo import ...`) nicht -> reportMissingImports.
extraPaths = ["."]

# Tkinter-typisches Rauschen: viele Widgets/Vars werden mit None initialisiert
# und erst spaeter gesetzt; pyright kann dieses Narrowing nicht nachvollziehen.
# Reiner False-Positive -> ganz aus.
reportOptionalMemberAccess = "none"
# Gemischt: teils Monkeypatch-FP (z.B. _was_in_grid), teils echte Fragilitaet
# (Lib-Internals, build-generierte Importe). Sichtbar lassen, aber entschaerfen.
reportAttributeAccessIssue = "warning"

# Tests werden weiter geprueft, aber das Mock-/MagicMock-typische Rauschen
# (Operatoren & Member-Zugriffe auf Mocks) wird dort unterdrueckt.
[[tool.pyright.executionEnvironments]]
root = "tests"
reportOperatorIssue = "none"
reportOptionalSubscript = "none"
reportOptionalMemberAccess = "none"
reportAttributeAccessIssue = "none"
reportCallIssue = "none"
reportArgumentType = "none"
